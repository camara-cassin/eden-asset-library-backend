# fly.toml - Fly.io configuration for EDEN Asset Library Backend
# 
# IMPORTANT: Before deploying, change the app name below to something unique.
# For example: "eden-asset-library-backend-yourname"

app = "eden-asset-library-backend"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "poetry run alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  AI_ENABLED = "false"
